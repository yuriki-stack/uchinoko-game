<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うちの猫ゲーム - Stage 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-shell">
  <header class="hud">
    <div class="brand">🐾 うちの猫ゲーム <span>Stage 1</span></div>
    <div class="stats">
      <div>⭐ <b id="score">0</b></div>
      <div>❤️ <b id="lives">3</b></div>
      <div>🏠 <b id="progress">0%</b></div>
    </div>
  </header>

  <main class="stage-wrap">
    <canvas id="game" width="960" height="540" aria-label="うちの猫ゲーム"></canvas>

    <div id="startOverlay" class="overlay">
      <div class="panel">
        <div class="bigcat">🐱</div>
        <h1>うちのおうち</h1>
        <p>Version 1.3</p>
        <p class="small">歩く・走る・ジャンプ・アイテム取得など、<br>猫の動きをパワーアップしました。</p>
        <button id="startBtn">ゲームスタート</button>
      </div>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
      <div class="panel">
        <h2>一時停止</h2>
        <p>ひと休み中です 🐾</p>
        <button id="resumeBtn">再開</button>
      </div>
    </div>

    <div id="clearOverlay" class="overlay hidden">
      <div class="panel">
        <div class="bigcat">🎉🐱</div>
        <h2>ステージクリア！</h2>
        <p>おうちに到着しました。</p>
        <p>スコア：<b id="clearScore">0</b></p>
        <button id="retryBtn">もう一度遊ぶ</button>
      </div>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <div class="panel">
        <div class="bigcat">😿</div>
        <h2>ゲームオーバー</h2>
        <p>もう一度おうちを目指そう！</p>
        <button id="retryBtn2">リトライ</button>
      </div>
    </div>
  </main>

  <div class="controls">
    <button id="leftBtn" aria-label="左">◀</button>
    <button id="jumpBtn" aria-label="ジャンプ">⬆ ジャンプ</button>
    <button id="rightBtn" aria-label="右">▶</button>
    <button id="dashBtn" aria-label="ダッシュ">💨</button>
  </div>

  <footer>
    PC：← → 移動 / Shift ダッシュ / Space ジャンプ / P 一時停止　
    スマホ：画面下のボタン
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
