<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>うちの猫ゲーム - Version 1.6</title><link rel="stylesheet" href="style.css"></head><body><div class="game-shell"><header class="hud"><div class="brand">🐾 うちの猫ゲーム <span id="stageLabel">Stage 1</span></div><div class="stats"><div>⭐ <b id="score">0</b></div><div>❤️ <b id="lives">3</b></div><div>🏠 <b id="progress">0%</b></div></div></header><div class="abilitybar" id="abilityPanel">🐟 <b id="fish">0</b>　🍪 <b id="snack">0</b>　⭐ <b id="star">0</b>　｜ Lv.<b id="level">1</b>　｜ 能力：移動<b id="speed">1.00</b> / ジャンプ<b id="jumpPower">1.00</b> / ダッシュ<b id="dashPower">1.00</b>　｜ ベスト <b id="best">0</b></div><div class="stage-select"><b>ステージ選択</b><button id="stage1Btn">1：おうち</button><button id="stage2Btn">2：夜の庭</button></div><section class="mission"><b>ミッション</b><span id="missionText">魚を3個集める</span><span id="missionStatus">0/3</span><span>コンボ：<b id="combo">0</b></span><span>次のLvまで：<b id="nextExp">50pt</b></span><span id="abilityText">なし</span></section><main class="stage-wrap"><canvas id="game" width="960" height="540"></canvas><div id="overlay" class="overlay"><div class="panel"><div class="bigcat">🐱</div><h1 id="overlayTitle">うちのおうち</h1><p id="overlayText">Version 1.6.1：遊びやすさを改善しました。</p><button id="startBtn">ゲームスタート</button></div></div></main><div class="controls"><button data-key="left">◀</button><button data-key="jump">⬆ ジャンプ</button><button data-key="right">▶</button><button data-key="dash">💨</button><button id="pauseBtn">⏸</button><button id="collectionBtn">📖</button></div><footer>PC：← → 移動 / Space ジャンプ / Shift ダッシュ / P 一時停止 / C 図鑑<br>スマホ：画面下のボタン</footer></div><script src="script.js"></script></body></html>
